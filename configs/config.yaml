# Experiment sweep settings for the FL + LoRA + DP benchmark.
# Loaded by main.py:load_config(). See MEMORY.md for sweep grid details.

federated:
  num_clients: 3
  num_rounds: 2
  strategy: fedavg

lora:
  ranks: [4, 8]        # r values to sweep
  lora_alpha: 16
  lora_dropout: 0.1

privacy:
  epsilons: [8.0, null]   # null = no DP, baseline; 8.0 = DP
  target_delta: 1.0e-5
  max_grad_norm: 1.0          # clipping threshold C

data:
  dirichlet_alphas: [0.1, 1.0, 100.0]  # low = highly skewed, high = ~IID
  num_labels: 2

training:
  local_epochs: 1
  batch_size: 16
  learning_rate: 5.0e-5
  seed: 42
